[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalsieve"
version = "0.2.0"
description = "Zero-dependency runtime-dispatched AVX2/NEON SIMD engine for online multivariate causal discovery, exogenous root-cause localization, and lossless-recoverable stream digests for humans and AI agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "CausalSieve Contributors" }]
maintainers = [{ name = "CausalSieve Contributors" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "causal-discovery",
    "granger-causality",
    "root-cause-analysis",
    "observability",
    "prometheus",
    "opentelemetry",
    "streaming",
    "time-series",
    "mcp",
    "multi-agent",
    "simd",
    "avx2",
    "neon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pgg898200-ship-it/causalsieve"
"Interactive Explorer" = "https://pgg898200-ship-it.github.io/causalsieve/"
Documentation = "https://pgg898200-ship-it.github.io/causalsieve/llms.txt"
Benchmarks = "https://github.com/pgg898200-ship-it/causalsieve/blob/main/BENCHMARKS.md"
"Agent Skill (skills.sh)" = "https://skills.sh/pgg898200-ship-it/causalsieve/causalsieve"
Repository = "https://github.com/pgg898200-ship-it/causalsieve"
Issues = "https://github.com/pgg898200-ship-it/causalsieve/issues"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
causalsieve = "causalsieve.cli:main"
causalsieve-mcp = "causalsieve.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
causalsieve = ["*.pyi", "py.typed", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
build-verbosity = 1
test-command = "python -c \"import causalsieve; s = causalsieve.CausalSieve(dim=4, lag=1); s.push([1.0, 2.0, 3.0, 4.0]); print(causalsieve.__version__, causalsieve.simd_isa(), causalsieve.library_path())\" && causalsieve info --json"
