  <title>CausalSieve Single-Pass SIMD Architecture</title>
  <desc>End-to-end streaming architecture from ingestion adapters through shifted-anchor normalization, C++20 SIMD online causal math, to CausalDigest, lossless FP64 ring, and MCP CausalBlackboard.</desc>
