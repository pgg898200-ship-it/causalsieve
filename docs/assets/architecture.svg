  <text x="24.0" y="54.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">Zero Python runtime dependencies  •  C++20 (avx2+fma / ARM64 NEON)  •  1.34 µs/tick (D=8), 385k ticks/s (D=16), 75.7M obs/s (Tier-2 D=4,096)</text>
  <text x="96.0" y="80.0" fill="#22d3ee" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">1. INGEST</text>
  <text x="274.0" y="80.0" fill="#22d3ee" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">2. PRE-CONDITION</text>
  <text x="522.0" y="80.0" fill="#22d3ee" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">3. SINGLE-PASS SIMD CORE</text>
  <text x="812.0" y="80.0" fill="#22d3ee" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">4. DIGEST &amp; AGENTS</text>
