  <text x="36.0" y="130.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">• CSV / array('d')</text>
