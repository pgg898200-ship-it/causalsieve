<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" width="900" height="455" role="img" aria-labelledby="title desc">
<title id="title">Database latency rises before API latency in a synthetic incident</title>
<desc id="desc">Two aligned traces show a three-minute excerpt from 600 five-second samples. The fixture injects a database delay at time zero. The API uses the previous database measurement. The full fixture ranks latency_seconds{service=db} first and latency_seconds{service=api} second.</desc>
<metadata>Input: examples/prometheus_incident.py, demo_response(), seed 2026. Lines show every sample at indices 468 through 504 inclusive in milliseconds. Onset is sample 480. Candidate order uses the full 600-sample run.</metadata>
