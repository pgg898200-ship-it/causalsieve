name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-verify:
    name: Linux x86_64 (ASan+UBSan, Pytest, Breaker, Lint, Wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build native C++20 core and run ASan+UBSan + parity tests
        run: |
          make all
          ./build/test_core_cpp_asan
          ./build/test_core_cpp_opt --parity-so ./build/libcausalsieve.so ./build/libcausalsieve_scalar.so

      - name: Install test, lint, and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest numpy scipy pandas ruff mypy

      - name: Lint and strict type check
        run: |
          ruff check python/causalsieve setup.py
          mypy --strict --ignore-missing-imports python/causalsieve

      - name: Run Python unit, oracle, causality, RCA, digest, and MCP tests
        run: |
          pytest tests/ -v
          pytest tests/breaker_audit.py -v -k "not test_live_binary_sha256_matches_all_benchmark_jsons"

      - name: Verify zero-runtime-dependency execution on bare Python
        run: |
          python -m venv --clear /tmp/cs_bare_env
          /tmp/cs_bare_env/bin/python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
          PYTHONPATH="$PWD/python" /tmp/cs_bare_env/bin/python -c "
          import causalsieve as cs
          with cs.CausalSieve(dim=4, lag=2, channel_names=['a', 'b', 'c', 'd']) as s:
              for t in range(40):
                  s.push([float(t % 5), float((t + 1) % 3), 0.1 * t, 1.0])
              attr = s.root_attribution()
              assert len(attr.ranked_channels) == 4
          print('bare-python-ok:', cs.simd_isa())
          "
          rm -rf /tmp/cs_bare_env

      - name: Build portable wheel and sdist and smoke-test in isolated bare venv
        env:
          CAUSALSIEVE_PORTABLE: "1"
        run: |
          python -m build --wheel --sdist
          ls -lh dist/
          python -m venv --clear /tmp/cs_wheel_smoke
          /tmp/cs_wheel_smoke/bin/pip install --no-deps dist/causalsieve-*.whl
          (
            cd /tmp
            /tmp/cs_wheel_smoke/bin/causalsieve info --json
            /tmp/cs_wheel_smoke/bin/python -c "
          import importlib.util, json, math, subprocess, sys
          assert importlib.util.find_spec('numpy') is None
          import causalsieve as cs
          assert 'site-packages' in (cs.library_path() or '')
          db = [math.sin(0.37 * t) + 0.4 * math.cos(0.91 * t) + (8.0 if t >= 40 else 0.0) for t in range(60)]
          api = [0.2 * math.sin(0.53 * t) + (1.6 * db[t - 1] if t > 0 else 0.0) for t in range(60)]
          df = {'time': list(range(60)), 'db_cpu': db, 'api_lat': api}
          sieve, dig = cs.analyze_dataframe(df, lag=2)
          assert dig.dim == 2 and dig.ticks == 60
          sieve.close()
          prom = {'status': 'success', 'data': {'resultType': 'matrix', 'result': [
              {'metric': {'__name__': 'cpu', 'svc': 'db'}, 'values': [[1700000000 + t, str(db[t])] for t in range(60)]},
              {'metric': {'__name__': 'lat', 'svc': 'api'}, 'values': [[1700000000 + t, str(api[t])] for t in range(60)]},
          ]}}
          ps, pdig = cs.analyze_prometheus(prom, lag=2)
          assert pdig.dim == 2 and pdig.ticks == 60
          ps.close()
          res = cs.rcaeval_rca(df, inject_time=40)
          assert res['ranks'] and res['ranks'][0] == 'db', res
          proc = subprocess.run(
              ['/tmp/cs_wheel_smoke/bin/causalsieve-mcp'],
              input=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {}}) + '\n',
              capture_output=True, text=True, check=True, timeout=15,
          )
          resp = json.loads(proc.stdout.strip().splitlines()[0])
          assert resp['result']['serverInfo']['name'] == 'causalsieve'
          print('wheel-smoke-ok:', cs.library_path(), cs.simd_isa())
          "
          )
          rm -rf /tmp/cs_wheel_smoke

  macos-arm64-neon:
    name: macOS ARM64 (Apple Silicon NEON Build, Wheel & Tests)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run C++20 native tests on Apple Silicon ARM64
        run: |
          mkdir -p build
          clang++ -std=c++20 -O3 -fno-math-errno -fno-trapping-math -fPIC -dynamiclib \
            -install_name @rpath/libcausalsieve.dylib -Icsrc csrc/causalsieve.cpp \
            -o build/libcausalsieve.dylib -lm
          clang++ -std=c++20 -O3 -fno-math-errno -fno-trapping-math -Icsrc \
            csrc/test_core_cpp.cpp csrc/causalsieve.cpp -o build/test_core_cpp_arm64 -lm
          ./build/test_core_cpp_arm64

      - name: Build macOS ARM64 wheel and smoke-test in bare venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest numpy scipy pandas
          python -m build --wheel
          ls -lh dist/
          python -m venv --clear /tmp/cs_mac_smoke
          /tmp/cs_mac_smoke/bin/pip install --no-deps dist/causalsieve-*.whl
          (
            cd /tmp
            /tmp/cs_mac_smoke/bin/causalsieve info --json
            /tmp/cs_mac_smoke/bin/python -c "
          import causalsieve as cs
          assert 'libcausalsieve.dylib' in (cs.library_path() or '')
          df = {'a': [float(i % 5) + (10.0 if i > 35 else 0.0) for i in range(50)], 'b': [float(i % 3) for i in range(50)]}
          s, d = cs.analyze_dataframe(df, lag=2)
          assert d.ticks == 50 and d.dim == 2
          s.close()
          print('macos-arm64-wheel-ok:', cs.library_path(), cs.simd_isa())
          "
          )
          rm -rf /tmp/cs_mac_smoke

      - name: Run Python test suite on macOS ARM64
        run: |
          pytest tests/ -v
