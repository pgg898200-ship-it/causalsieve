name: Deploy GitHub Pages (Explorer + Agent-Discoverable Markdown)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Explorer & Pure-Markdown Agent Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site with Explorer, SVGs, and pure-Markdown Agent Docs
        run: |
          rm -rf _site
          mkdir -p _site/skills/causalsieve _site/docs/assets
          touch _site/.nojekyll
          cp demo/causalsieve_explorer.html _site/index.html
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp SKILL.md _site/SKILL.md
          cp README.md _site/README.md
          cp BENCHMARKS.md _site/BENCHMARKS.md
          cp sitemap.xml _site/sitemap.xml
          cp robots.txt _site/robots.txt
          cp context7.json _site/context7.json
          cp skills/causalsieve/SKILL.md _site/skills/causalsieve/SKILL.md
          cp docs/*.md _site/docs/
          cp docs/assets/*.svg _site/docs/assets/
          ls -la _site/ _site/docs/ _site/docs/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
